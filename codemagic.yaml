workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Download gradle-wrapper.jar
        script: |
          WRAPPER_DIR="${CM_BUILD_DIR}/gradle/wrapper"
          mkdir -p "$WRAPPER_DIR"
          JAR="$WRAPPER_DIR/gradle-wrapper.jar"
          if [ ! -f "$JAR" ]; then
            echo "A fazer download do gradle-wrapper.jar (Gradle 8.9)..."
            curl -fsSL "https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o "$JAR" \
              || curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o "$JAR" \
              || wget -q "https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -O "$JAR"
            echo "✅ gradle-wrapper.jar: $(du -sh $JAR | cut -f1)"
          else
            echo "✅ gradle-wrapper.jar já presente no repo"
          fi

      - name: Generate release keystore
        script: |
          keytool -genkeypair \
            -alias "nexa_key" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 25000 \
            -keystore "${CM_BUILD_DIR}/app/nexa_release.keystore" \
            -storepass "@jonas00" \
            -keypass "@jonas00" \
            -dname "CN=Nexa, OU=Dev, O=Nexa, L=Lisboa, ST=Lisboa, C=PT" \
            -noprompt
          echo "✅ Keystore gerado: app/nexa_release.keystore"

      - name: Install Pillow
        script: pip3 install Pillow --quiet

      - name: Process icons
        script: |
          python3 << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          CM      = os.environ["CM_BUILD_DIR"]
          RES     = os.path.join(CM, "app/src/main/res")
          LAUNCHER_SRC  = os.path.join(CM, "ic_launcher.png")
          SPLASH_SRC    = os.path.join(CM, "splash_icon.png")

          if not os.path.exists(LAUNCHER_SRC):
              raise FileNotFoundError("ic_launcher.png nao encontrado na raiz do repo!")
          if not os.path.exists(SPLASH_SRC):
              raise FileNotFoundError("splash_icon.png nao encontrado na raiz do repo!")

          # ── Launcher densities ───────────────────────────────────────────────
          DENSITIES = {
              "mipmap-ldpi":   36,
              "mipmap-mdpi":   48,
              "mipmap-hdpi":   72,
              "mipmap-xhdpi":  96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi":192,
          }
          # Adaptive foreground canvas sizes (108dp × density)
          FG_SIZES = {
              "mipmap-mdpi":   108,
              "mipmap-hdpi":   162,
              "mipmap-xhdpi":  216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi":432,
          }

          def rounded(img, size, ratio=0.23):
              img = img.convert("RGBA").resize((size, size), Image.LANCZOS)
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).rounded_rectangle(
                  [0, 0, size - 1, size - 1], radius=int(size * ratio), fill=255)
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              out.paste(img, (0, 0), mask)
              return out

          def save(img, path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, "PNG", optimize=True)
              print(f"  -> {path}")

          src = Image.open(LAUNCHER_SRC)
          for d, sz in DENSITIES.items():
              save(rounded(src, sz, 0.23), os.path.join(RES, d, "ic_launcher.png"))
              save(rounded(src, sz, 0.50), os.path.join(RES, d, "ic_launcher_round.png"))

          for d, fg in FG_SIZES.items():
              icon_sz = int(fg * 0.66)
              fg_img  = src.copy().convert("RGBA").resize((icon_sz, icon_sz), Image.LANCZOS)
              canvas  = Image.new("RGBA", (fg, fg), (0, 0, 0, 0))
              off     = (fg - icon_sz) // 2
              canvas.paste(fg_img, (off, off), fg_img)
              save(canvas, os.path.join(RES, d, "ic_launcher_foreground.png"))

          print("✅ Launcher icons gerados")

          # ── Splash icon (windowSplashScreenAnimatedIcon) ─────────────────────
          # O SplashScreen API exige que o drawable caiba numa área de 160dp.
          # Para PNG: o canvas deve ter 288dp×288dp (@xxxhdpi = 288*4 = 1152px)
          # com o ícone a ocupar os 160dp centrais (160*4 = 640px).
          # Razão: o sistema aplica um clip circular de 2/3 do canvas, então
          # o ícone real deve caber em 160/288 ≈ 55% do canvas.
          # Usamos canvas=1152 ícone=640 para xxxhdpi e escalamos para os outros.
          SPLASH_CANVAS = {
              "mipmap-mdpi":   288,   # 288 * 1 = 288px
              "mipmap-hdpi":   432,   # 288 * 1.5
              "mipmap-xhdpi":  576,   # 288 * 2
              "mipmap-xxhdpi": 864,   # 288 * 3
              "mipmap-xxxhdpi":1152,  # 288 * 4
          }
          ICON_RATIO = 640 / 1152  # ≈ 0.556 — ícone a 55.6% do canvas

          splash_src = Image.open(SPLASH_SRC).convert("RGBA")

          for d, canvas_px in SPLASH_CANVAS.items():
              icon_px = int(canvas_px * ICON_RATIO)
              icon    = splash_src.copy().resize((icon_px, icon_px), Image.LANCZOS)
              canvas  = Image.new("RGBA", (canvas_px, canvas_px), (0, 0, 0, 0))
              off     = (canvas_px - icon_px) // 2
              canvas.paste(icon, (off, off), icon)
              save(canvas, os.path.join(RES, d, "splash_icon.png"))

          print("✅ Splash icons gerados")
          PYEOF

      - name: Set executable permission on gradlew
        script: chmod +x "${CM_BUILD_DIR}/gradlew"

      - name: Build release APK
        script: cd "${CM_BUILD_DIR}" && ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        script: cd "${CM_BUILD_DIR}" && ./gradlew bundleRelease --no-daemon

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - dev@example.com
        notify:
          success: true
          failure: true

