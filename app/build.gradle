apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
namespace 'com.nexa.app'
compileSdk 35

signingConfigs {
release {
storeFile file("nexa_release.keystore")
storePassword "@jonas00"
keyAlias "nexa_key"
keyPassword "@jonas00"
}
}

defaultConfig {
applicationId "com.nexa.app"
minSdk 21
targetSdk 35
versionCode 1
versionName "0.0.1"
}

buildTypes {
release {
minifyEnabled false
signingConfig signingConfigs.release
proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
}
debug {
signingConfig signingConfigs.release
}
}

compileOptions {
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}

kotlinOptions {
jvmTarget = '17'
}

buildFeatures {
viewBinding true
}

lint {
checkReleaseBuilds false
abortOnError false
}

sourceSets {
main {
assets.srcDirs = ['src/main/assets_bundled', 'src/main/assets']
}
}
}

// ---------------------------------------------------------------------
// Build automático do Svelte (Vite) como parte do build do APK.
// Corre "npm install && npm run build" dentro de src/main/assets (onde
// está o package.json/vite.config.js originais) e copia o resultado
// (dist/) para src/main/assets_bundled/www, servido depois pelo
// NanoHTTPD local server no MainActivity. Nada dentro de src/main/assets
// é alterado — só lido.
// ---------------------------------------------------------------------

def svelteDir = file("src/main/assets")
def svelteDist = file("src/main/assets/dist")
def bundledWww = file("src/main/assets_bundled/www")

def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
def npmCmd = isWindows ? "npm.cmd" : "npm"

tasks.register("npmInstallSvelte", Exec) {
workingDir svelteDir
commandLine npmCmd, "install", "--no-audit", "--no-fund"
doFirst {
println "→ A instalar dependências npm em ${svelteDir}"
}
}

tasks.register("npmBuildSvelte", Exec) {
dependsOn "npmInstallSvelte"
workingDir svelteDir
commandLine npmCmd, "run", "build"
doFirst {
println "→ A compilar Svelte/Vite em ${svelteDir}"
}
}

tasks.register("copySvelteBuild", Copy) {
dependsOn "npmBuildSvelte"
from svelteDist
into bundledWww
outputs.dir(bundledWww)
doFirst {
delete bundledWww
println "→ A copiar dist/ compilado para ${bundledWww}"
}
}

// Garante que QUALQUER task do módulo :app que dependa (direta ou
// indiretamente) de ler src/main/assets_bundled só corre depois de
// copySvelteBuild ter terminado — incluindo tasks de Lint, que também
// leem os assets finais e são invocadas automaticamente por
// assembleRelease/bundleRelease.
afterEvaluate {
tasks.matching { it.name != "copySvelteBuild" && it.name != "npmBuildSvelte" && it.name != "npmInstallSvelte" }.configureEach { t ->
t.mustRunAfter tasks.named("copySvelteBuild")
}
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
dependsOn "copySvelteBuild"
}
tasks.matching { it.name.startsWith("generate") && it.name.endsWith("Assets") }.configureEach {
dependsOn "copySvelteBuild"
}
tasks.matching { it.name.startsWith("generate") && it.name.contains("Lint") }.configureEach {
dependsOn "copySvelteBuild"
}
tasks.matching { it.name.startsWith("lint") }.configureEach {
dependsOn "copySvelteBuild"
}
}

dependencies {
implementation 'androidx.core:core-ktx:1.16.0'
implementation 'androidx.appcompat:appcompat:1.7.0'
implementation 'com.google.android.material:material:1.14.0-alpha06'
implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
implementation 'com.github.bumptech.glide:glide:4.16.0'
kapt 'com.github.bumptech.glide:compiler:4.16.0'
implementation 'androidx.fragment:fragment-ktx:1.8.6'
implementation 'androidx.core:core-splashscreen:1.0.1'
implementation 'com.squareup.okhttp3:okhttp:4.12.0'
implementation 'androidx.media3:media3-exoplayer:1.3.1'
implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
implementation 'androidx.media3:media3-ui:1.3.1'
implementation 'org.nanohttpd:nanohttpd:2.3.1'
testImplementation 'junit:junit:4.13.2'
androidTestImplementation 'androidx.test.ext:junit:1.2.1'
androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}