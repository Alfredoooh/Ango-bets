plugins {
id 'com.android.application'
id 'kotlin-android'
id 'com.facebook.react'
}

react {
root = file("${rootDir}/coinbox")
reactNativeDir = file("${rootDir}/coinbox/node_modules/react-native")
hermesCommand = "${rootDir}/coinbox/node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
codegenDir = file("${rootDir}/coinbox/node_modules/react-native-codegen")
entryFile = file("${rootDir}/coinbox/index.ts")
bundleAssetName = "index.android.bundle"
bundleInDebug = false
bundleInRelease = true
devDisabledInRelease = true
autolinkLibrariesWithApp()
}

android {
namespace 'com.nexa.app'
compileSdk 35

signingConfigs {
release {
storeFile file("nexa_release.keystore")
storePassword "@jonas00"
keyAlias "nexa_key"
keyPassword "@jonas00"
}
}

defaultConfig {
applicationId "com.nexa.app"
minSdk 24
targetSdk 35
versionCode 1
versionName "0.0.1"
}

buildTypes {
release {
minifyEnabled false
signingConfig signingConfigs.release
proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
}
debug {
signingConfig signingConfigs.release
}
}

compileOptions {
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}

kotlinOptions {
jvmTarget = '17'
}

packagingOptions {
pickFirst '**/libc++_shared.so'
pickFirst '**/libjsc.so'
pickFirst '**/libhermes.so'
}
}

dependencies {
implementation "com.facebook.react:react-android"
implementation "com.facebook.react:hermes-android"
implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
implementation 'androidx.core:core-ktx:1.16.0'
implementation 'androidx.appcompat:appcompat:1.7.0'
testImplementation 'junit:junit:4.13.2'
}