pluginManagement {
includeBuild("${rootDir}/coinbox/node_modules/@react-native/gradle-plugin")
repositories {
google()
mavenCentral()
gradlePluginPortal()
}
}

plugins {
id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
ex.autolinkLibrariesFromCommand(
["npx", "@react-native-community/cli", "config"],
file("${rootDir}/coinbox"),
files(
"${rootDir}/coinbox/package.json",
"${rootDir}/coinbox/yarn.lock",
"${rootDir}/coinbox/package-lock.json",
"${rootDir}/coinbox/pnpm-lock.yaml",
"${rootDir}/coinbox/react-native.config.js"
)
)
}

dependencyResolutionManagement {
repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
repositories {
google()
mavenCentral()
maven { url "${rootDir}/coinbox/node_modules/react-native/android" }
maven { url "${rootDir}/coinbox/node_modules/jsc-android/dist" }
}
}

rootProject.name = "nexa"
include(":app")